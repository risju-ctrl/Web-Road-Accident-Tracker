<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#c3c0ba" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&display=swap" />
    <link rel="icon" type="image/png" href="/agap-mark.png" />
    <title>AGAP | Road Incident Reporting</title>
    <script>
      // Restore the saved theme before first paint so there is no flash. Dark is the default.
      (function () {
        var theme = 'dark';
        try { if (localStorage.getItem('theme') === 'light') theme = 'light'; } catch (e) {}
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <!-- Sign-in scene. A blocked CDN is not fatal: the page falls back to its CSS road grid. -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
