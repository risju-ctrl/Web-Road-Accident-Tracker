*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);transition:background-color .3s var(--ease),color .3s var(--ease);color:var(--text);font-family:"Space Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
.page{min-height:100%;display:grid;grid-template-columns:minmax(0,2.05fr) minmax(400px,1fr)}

/* motion primitives */
.rise{opacity:0;transform:translateY(12px);animation:rise .6s var(--ease) var(--d,0ms) forwards}
@keyframes rise{to{opacity:1;transform:none}}
.fade{opacity:0;animation:fade .8s var(--ease) var(--d,0ms) forwards}
@keyframes fade{to{opacity:1}}

/* visual */
.visual{position:relative;overflow:hidden;background:var(--bg);display:flex;flex-direction:column;justify-content:space-between;padding:40px 56px 56px;min-height:100vh}
.art{position:absolute;inset:0;width:100%;height:100%}
.visual>*:not(.art){position:relative;z-index:1}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:clamp(150px,16vw,200px);aspect-ratio:3.1;background:var(--logo) no-repeat left center/contain}
.tag h2{font-size:clamp(30px,3.4vw,52px);font-weight:600;line-height:1.12;letter-spacing:-.02em}
.tag h2 span{display:block}
.tag h2 .g{color:var(--champagne)}

/* art */
.visual:before{content:"";position:absolute;inset:0 0 auto;height:130px;background:linear-gradient(var(--bg),transparent);z-index:0;pointer-events:none}
.visual:after{content:"";position:absolute;inset:auto 0 0;height:46%;background:linear-gradient(transparent,var(--bg) 88%);pointer-events:none}
.plabel{position:absolute!important;left:0;top:0;z-index:1;opacity:0;font-size:13px;font-weight:500;padding-left:9px;border-left:1.5px solid var(--gold);white-space:nowrap;pointer-events:none;will-change:transform}

/* panel */
.panel{background:radial-gradient(110% 55% at 50% 0%,color-mix(in srgb,var(--champagne) 8%,transparent),transparent 65%),var(--surface);border-left:1px solid var(--line);display:flex;align-items:center;padding:48px clamp(32px,5vw,72px);transition:background-color .3s var(--ease)}
.box{width:100%;max-width:360px}
h1{font-size:30px;font-weight:600;letter-spacing:-.02em;margin-bottom:8px}
.lead{color:var(--muted);font-size:14.5px;margin-bottom:28px}
.field{margin-bottom:16px}
label{display:block;font-size:13px;font-weight:500;margin-bottom:6px}
.wrap{position:relative}
input{width:100%;height:46px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:var(--field);color:var(--text);font:inherit;font-size:15px;outline:none;transition:border-color .2s var(--ease),box-shadow .2s var(--ease)}
input:hover{border-color:var(--line2)}
input:focus{border-color:var(--champagne);box-shadow:0 0 0 3px color-mix(in srgb,var(--champagne) 20%,transparent)}
input[aria-invalid="true"]{border-color:var(--error)}
input[aria-invalid="true"]:focus{box-shadow:0 0 0 3px color-mix(in srgb,var(--error) 20%,transparent)}
#pw{padding-right:48px}
.eye{position:absolute;right:4px;top:4px;width:38px;height:38px;border:0;border-radius:6px;background:transparent;color:var(--muted);cursor:pointer;display:grid;place-items:center;transition:color .2s,background-color .2s}
.eye:hover{color:var(--text);background:var(--graphite)}
.eye svg{grid-area:1/1;transition:opacity .2s var(--ease),transform .2s var(--ease)}
.eye .off{opacity:0;transform:scale(.8)}
.eye[aria-pressed="true"] .on{opacity:0;transform:scale(.8)}
.eye[aria-pressed="true"] .off{opacity:1;transform:none}
:is(.eye,button,a):focus-visible{outline:2px solid var(--champagne);outline-offset:2px}
.msg{display:grid;grid-template-rows:0fr;transition:grid-template-rows .25s var(--ease)}
.msg>div{overflow:hidden;min-height:0}
.msg.show{grid-template-rows:1fr}
.msg p{font-size:13px;color:var(--error);padding-top:6px;opacity:0;transform:translateY(-4px);transition:opacity .25s var(--ease),transform .25s var(--ease)}
.msg.show p{opacity:1;transform:none}
.alert>div>div{display:flex;gap:10px;align-items:flex-start;padding:11px 13px;margin-bottom:16px;border:1px solid color-mix(in srgb,var(--error) 45%,transparent);border-left:3px solid var(--error);border-radius:8px;background:color-mix(in srgb,var(--error) 9%,transparent);font-size:13.5px}
.alert svg{flex:none;margin-top:2px;color:var(--error)}
.go{width:100%;height:48px;margin-top:8px;border:0;border-radius:8px;background:var(--champagne);color:var(--on);font:inherit;font-size:15px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;transition:background-color .2s var(--ease),transform .12s var(--ease)}
.go:hover:not(:disabled){background:var(--gold)}
.go:active:not(:disabled){transform:translateY(1px) scale(.995)}
.go:disabled{cursor:progress;background:var(--gold)}
.go[data-ok]:disabled{cursor:default;background:var(--champagne)}
.spin{width:16px;height:16px;border:2px solid;border-color:currentColor currentColor currentColor transparent;border-radius:50%;display:none;animation:rot .7s linear infinite}
.go[aria-busy="true"] .spin{display:block}
.chk{display:none}.go[data-ok] .chk{display:block}
@keyframes rot{to{transform:rotate(360deg)}}
.foot{margin-top:32px;padding-top:16px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted);display:flex;gap:9px;align-items:flex-start}.foot svg{flex:none;margin-top:2px;color:var(--champagne)}

@media (max-width:1180px){.page{grid-template-columns:minmax(0,1.4fr) minmax(380px,1fr)}.visual{padding:32px 36px 44px}}
@media (max-width:900px){
 .page{grid-template-columns:1fr;grid-template-rows:auto 1fr}
 .visual{min-height:0;height:190px;padding:22px 20px}
 .tag,.plabel{display:none}
 .panel{border-left:0;border-top:1px solid var(--line);align-items:flex-start;padding:32px 20px 40px}
}
@media (prefers-reduced-motion:reduce){
 *,*:before,*:after{animation-duration:.001ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
 .rise,.fade,.mk{opacity:1;transform:none}
 .route{stroke-dashoffset:0}
}

/* fallback when WebGL or Three.js is unavailable: static CSS-3D road grid with the gold route */
.visual>.fb{display:none;position:absolute!important;inset:0;overflow:hidden;z-index:0;pointer-events:none}
.no3d .fb{display:block}.no3d .art{display:none}
.fb i{position:absolute;left:8%;top:14%;width:130%;height:130%;transform:perspective(900px) rotateX(58deg) rotateZ(-32deg);
 background:repeating-linear-gradient(0deg,transparent 0 84px,var(--graphite) 84px 100px),repeating-linear-gradient(90deg,transparent 0 84px,var(--graphite) 84px 100px)}
.fb i:after{content:"";position:absolute;left:46%;top:38%;width:4px;height:34%;background:var(--gold);box-shadow:0 0 14px rgba(201,164,92,.45)}

/* right-panel additions */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:26px}
.eyebrow{display:inline-flex;align-items:center;gap:7px;padding:5px 11px 5px 9px;border:1px solid var(--line);border-radius:99px;font-size:12px;font-weight:500;color:var(--muted);letter-spacing:.02em}
.eyebrow svg{color:var(--champagne)}
.theme{position:relative;width:38px;height:38px;border:1px solid var(--line);border-radius:50%;background:transparent;color:var(--muted);cursor:pointer;display:grid;place-items:center;transition:color .2s,background-color .2s,border-color .2s}
.theme:hover{color:var(--text);background:var(--graphite);border-color:var(--line2)}
.theme svg{grid-area:1/1;transition:opacity .25s var(--ease),transform .35s var(--ease)}
:root[data-theme="light"] .theme .sun,:root:not([data-theme="light"]) .theme .moon{opacity:0;transform:rotate(-60deg) scale(.6)}
.ic{position:absolute;left:14px;top:23px;transform:translateY(-50%);color:var(--muted);pointer-events:none;transition:color .2s}
.wrap:focus-within .ic{color:var(--champagne)}
.ic-in{padding-left:42px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:4px 0 18px;font-size:13.5px}
.remember{display:flex;align-items:center;gap:9px;margin:0;font-size:13.5px;font-weight:400;color:var(--muted);cursor:pointer;user-select:none}
input[type="checkbox"]{appearance:none;-webkit-appearance:none;flex:none;width:18px;height:18px;padding:0;border-radius:5px;border:1px solid var(--line2);background:var(--field);display:grid;place-items:center;cursor:pointer}
input[type="checkbox"]:checked{background:var(--champagne);border-color:var(--champagne)}
input[type="checkbox"]:checked:after{content:"";width:9px;height:5px;border:2px solid var(--on);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
input[type="checkbox"]:focus-visible{box-shadow:0 0 0 3px color-mix(in srgb,var(--champagne) 25%,transparent)}
.lnk{border:0;background:none;padding:2px;font:inherit;font-size:13.5px;font-weight:500;color:var(--champagne);cursor:pointer;border-radius:4px;text-decoration:underline;text-decoration-color:transparent;text-underline-offset:3px;transition:text-decoration-color .2s}
.lnk:hover{text-decoration-color:currentColor}
.msg p.hint{color:var(--muted);display:flex;align-items:center;gap:6px}
.alert.info{--error:var(--champagne)}
.go .arr{transition:transform .2s var(--ease)}.go:hover:not(:disabled) .arr{transform:translateX(3px)}
.go[aria-busy="true"] .arr,.go[data-ok] .arr{display:none}
</style>
</head>
<body>
<div class="page">

  <section class="visual">
    <canvas class="art fade" id="art" aria-hidden="true"></canvas>
    <div class="fb" aria-hidden="true"><i></i></div>
    <div class="plabel" id="pl" aria-hidden="true">Sample incident</div>
    <div class="brand rise" style="--d:300ms">
      <div class="logo" role="img" aria-label="AGAP Road Incident Reporting"></div>
    </div>
    <div class="tag">
      <h2><span class="rise" style="--d:900ms">Report incidents.</span><span class="rise" style="--d:1030ms">Track responses.</span><span class="rise g" style="--d:1160ms">Improve road safety.</span></h2>
    </div>
  </section>

  <main class="panel">
    <div class="box">
      <div class="top rise" style="--d:380ms">
        <span class="eyebrow"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 4.5-3.2 7.8-8 9-4.8-1.2-8-4.5-8-9V6l8-3z"/><path d="M9 12l2 2 4-4"/></svg>Authorized access</span>
        <button class="theme" id="theme" type="button" aria-label="Switch to light mode">
          <svg class="sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg>
          <svg class="moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
        </button>
      </div>
      <h1 class="rise" style="--d:450ms">Welcome back</h1>
      <p class="lead rise" style="--d:520ms">Sign in to the Road Accident Tracker to report incidents and follow their status.</p>

      <div class="msg alert" id="alert" role="alert" aria-live="assertive"><div><div><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v6M12 16.5v.01"/></svg><span id="alertText"></span></div></div></div>

      <form id="f" novalidate>
        <div class="field rise" style="--d:600ms">
          <label for="email">Email</label>
          <div class="wrap"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M3.5 7.5l8.5 6 8.5-6"/></svg><input class="ic-in" id="email" name="email" type="email" autocomplete="username" inputmode="email" placeholder="name@agency.gov" aria-describedby="emailErr"></div>
          <div class="msg" id="emailMsg"><div><p id="emailErr"></p></div></div>
        </div>
        <div class="field rise" style="--d:680ms">
          <label for="pw">Password</label>
          <div class="wrap">
            <svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4.5" y="10.5" width="15" height="10" rx="2.5"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/></svg>
            <input class="ic-in" id="pw" name="password" type="password" autocomplete="current-password" aria-describedby="pwErr capsErr">
            <button class="eye" type="button" id="eye" aria-label="Show password" aria-pressed="false">
              <svg class="on" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="off" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18M10.6 5.1A10 10 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.2 4M6.5 6.5A17 17 0 0 0 2 12s3.6 7 10 7c1.6 0 3-.4 4.3-1M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
            </button>
          </div>
          <div class="msg" id="pwMsg"><div><p id="pwErr"></p></div></div>
          <div class="msg" id="capsMsg"><div><p class="hint" id="capsErr"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4l8 9h-5v4H9v-4H4l8-9zM9 20.5h6"/></svg>Caps Lock is on</p></div></div>
        </div>
        <div class="row rise" style="--d:730ms">
          <label class="remember"><input type="checkbox" id="remember" name="remember">Keep me signed in</label>
          <button class="lnk" type="button" id="forgot">Forgot password?</button>
        </div>
        <button class="go rise" style="--d:790ms" id="go" type="submit"><span class="spin" aria-hidden="true"></span><svg class="chk" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg><span id="goText">Sign in</span><svg class="arr" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
      </form>
      <p class="foot rise" style="--d:870ms"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 7.5v.01"/></svg><span>Need help signing in? Contact your system administrator.</span></p>
    </div>
  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ---------- CONNECT TO YOUR EXISTING AUTH ----------
   Replace signIn() with the project's real login request.
   Keep session/token handling and role-based redirect inside onSuccess(). */
var CONFIG = { loginUrl: '', forgotUrl: '' };   // forgotUrl: your password-reset page (optional)
function signIn(email, password, remember){
  if(!CONFIG.loginUrl){ return Promise.reject({code:'not_connected'}); }
  return fetch(CONFIG.loginUrl,{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',body:JSON.stringify({email:email,password:password,remember:!!remember})})
    .then(function(r){ if(r.status===401||r.status===403) throw {code:'invalid'}; if(!r.ok) throw {code:'server'}; return r.json(); });
}
function onSuccess(data){ /* existing token/session storage + role-based redirect goes here */ }

var $=function(i){return document.getElementById(i)};
var f=$('f'),email=$('email'),pw=$('pw'),go=$('go'),busy=false;
function setMsg(b,t){var m=$(b+'Msg');if(t){$(b+'Err').textContent=t;m.classList.add('show')}else m.classList.remove('show')}
function mark(el,bad){el.setAttribute('aria-invalid',bad?'true':'false')}
function showAlert(t,kind){$('alert').classList.toggle('info',kind==='info');$('alertText').textContent=t;$('alert').classList.add('show')}
function hideAlert(){$('alert').classList.remove('show')}
function validate(){
  var e=email.value.trim(),p=pw.value,first=null;
  var em=!e?'Enter your email address.':(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e)?'Enter a valid email address.':'');
  var pm=!p?'Enter your password.':'';
  setMsg('email',em);mark(email,!!em);setMsg('pw',pm);mark(pw,!!pm);
  first=em?email:(pm?pw:null);if(first)first.focus();return !first;
}
email.addEventListener('input',function(){if(email.getAttribute('aria-invalid')==='true'){setMsg('email','');mark(email,false)}hideAlert()});
pw.addEventListener('input',function(){if(pw.getAttribute('aria-invalid')==='true'){setMsg('pw','');mark(pw,false)}hideAlert()});
$('eye').addEventListener('click',function(){
  var show=pw.type==='password';pw.type=show?'text':'password';
  this.setAttribute('aria-pressed',show);this.setAttribute('aria-label',show?'Hide password':'Show password');pw.focus();
});
/* caps lock hint */
function caps(ev){var on=ev.getModifierState&&ev.getModifierState('CapsLock');$('capsMsg').classList.toggle('show',!!on)}
pw.addEventListener('keydown',caps);pw.addEventListener('keyup',caps);pw.addEventListener('blur',function(){$('capsMsg').classList.remove('show')});
$('forgot').addEventListener('click',function(){
  if(CONFIG.forgotUrl){location.href=CONFIG.forgotUrl;return}
  showAlert('To reset your password, contact your system administrator.','info');
});
/* light / dark theme (follows the system until the user picks one) */
var root=document.documentElement,tb=$('theme');
function setTheme(t,save){
  root.setAttribute('data-theme',t);
  tb.setAttribute('aria-label',t==='light'?'Switch to dark mode':'Switch to light mode');
  if(save){try{localStorage.setItem('agap-theme',t)}catch(e){}}
  if(window.agapScene)window.agapScene(t==='light',true);
}
tb.addEventListener('click',function(){setTheme(root.getAttribute('data-theme')==='light'?'dark':'light',true)});
tb.setAttribute('aria-label',root.getAttribute('data-theme')==='light'?'Switch to dark mode':'Switch to light mode');
try{matchMedia('(prefers-color-scheme: light)').addEventListener('change',function(e){var st=null;try{st=localStorage.getItem('agap-theme')}catch(x){}if(!st)setTheme(e.matches?'light':'dark',false)})}catch(e){}
function setBusy(b){busy=b;go.disabled=b;go.setAttribute('aria-busy',b);$('goText').textContent=b?'Signing in…':'Sign in';email.readOnly=b;pw.readOnly=b;$('remember').disabled=b}
f.addEventListener('submit',function(ev){
  ev.preventDefault();
  if(busy)return;
  hideAlert();
  if(!validate())return;
  setBusy(true);
  signIn(email.value.trim(),pw.value,$('remember').checked).then(function(d){
    go.setAttribute('aria-busy','false');go.setAttribute('data-ok','');$('goText').textContent='Signed in';onSuccess(d);
  }).catch(function(err){
    var c=err&&err.code,t='Unable to sign in. Check your connection and try again.';
    if(c==='invalid')t='Incorrect email or password.';
    else if(c==='server')t='The server could not process your request. Try again shortly.';
    else if(c==='not_connected')t='Preview only: the sign-in request is not connected to the application yet.';
    setTimeout(function(){setBusy(false);showAlert(t)},c==='not_connected'?900:0);
  });
});

/* ---------- 3D scene: road network, tracked response vehicle, incident pins (illustrative simulation) ----------
   Same Three.js (r128) scene and camera as before. Added: connected road surfaces on the existing street grid,
   lane dashes, a gold route ribbon laid on the road, and a few low-poly cars that follow arc-length-sampled paths.
   Vehicle positions are simulated; they are not GPS data. */
(function(){
  var cv=$('art'),vis=cv.parentNode;
  function fallback(){vis.classList.add('no3d')}
  if(!window.THREE){fallback();return}
  var isLt=document.documentElement.getAttribute('data-theme')==='light',T=THREE,reduce=matchMedia('(prefers-reduced-motion: reduce)').matches,narrow=matchMedia('(max-width:900px)'),R;
  try{R=new T.WebGLRenderer({canvas:cv,antialias:true,alpha:true})}catch(e){fallback();return}
  R.setPixelRatio(Math.min(devicePixelRatio||1,narrow.matches?1.5:1.75));

  var disp=[];function G(o){disp.push(o);return o}
  var sc=new T.Scene(),fog=new T.Fog(0x121212,430,1080),gm;sc.fog=fog;
  var cam=new T.PerspectiveCamera(36,1,10,3000),tgt=new T.Vector3(20,0,-10);
  var amb=new T.AmbientLight(0x9a968a,.62);sc.add(amb);
  var d1=new T.DirectionalLight(0xE9DDAA,.95);d1.position.set(-300,420,200);sc.add(d1);
  var d2=new T.DirectionalLight(0xC9A45C,.3);d2.position.set(300,200,-300);sc.add(d2);
  var carLight=new T.PointLight(0x4F80C8,0,95,1.5);sc.add(carLight);
  var W=new T.Group();W.rotation.y=-.55;sc.add(W);
  var N=18,C=52,o=N/2,seed=7,RW=11,SW=16,SPAN=N*C;
  function rnd(){seed=(seed*16807)%2147483647;return (seed-1)/2147483646}
  function sx(i){return (i-o)*C}
  function ease(x){return 1-Math.pow(1-x,3)}
  function prog(t,a,b){return Math.min(1,Math.max(0,(t-a)/(b-a)))}

  var ground=new T.Mesh(G(new T.PlaneGeometry(3200,3200)),(gm=G(new T.MeshBasicMaterial({color:0x171715}))));
  ground.rotation.x=-Math.PI/2;ground.position.y=-.5;W.add(ground);

  /* ---- roads: one surface + one kerb strip per street line, all on the existing grid ---- */
  var pg=G(new T.PlaneGeometry(1,1));pg.rotateX(-Math.PI/2);
  var nR=(N+1)*2,roads=new T.InstancedMesh(pg,G(new T.MeshBasicMaterial({color:0xffffff})),nR),walks=new T.InstancedMesh(pg,G(new T.MeshBasicMaterial({color:0xffffff})),nR),rd=[],ob=new T.Object3D(),i,j;
  for(i=0;i<=N;i++)for(var k=0;k<2;k++){            /* k0: street running along z, k1: running along x */
    var c=sx(i),id=i*2+k;
    ob.position.set(k?0:c,k?.05:.06,k?c:0);ob.scale.set(k?SPAN:RW,1,k?RW:SPAN);ob.updateMatrix();roads.setMatrixAt(id,ob.matrix);
    ob.position.y=k?.02:.03;ob.scale.set(k?SPAN:SW,1,k?SW:SPAN);ob.updateMatrix();walks.setMatrixAt(id,ob.matrix);
    rd.push({id:id,d:Math.abs(c)});
  }
  W.add(walks);W.add(roads);
  var gcol=new T.Color(0x171715),rcol=new T.Color(0x211f1c),scol=new T.Color(0x34342f),col=new T.Color();

  /* lane dashes, kept clear of intersections */
  var dp=[];
  for(i=0;i<=N;i++)for(var v=-SPAN/2+11;v<SPAN/2-5;v+=14){
    var r=((v%C)+C)%C;if(r<9||r>C-9)continue;dp.push(sx(i),v,0,v,sx(i),1);
  }
  var dashes=new T.InstancedMesh(G(pg.clone()),G(new T.MeshBasicMaterial({color:0xC9A45C,transparent:true,opacity:0,depthWrite:false,fog:true})),dp.length/3);
  for(i=0;i<dp.length/3;i++){var q=dp[i*3+2];ob.position.set(dp[i*3],.085,dp[i*3+1]);ob.scale.set(q?5:.7,1,q?.7:5);ob.updateMatrix();dashes.setMatrixAt(i,ob.matrix)}
  /* note: for q=1 (street along x) the pair is (z,x) -> position(x=v, z=sx) */
  W.add(dashes);

  /* ---- where vehicles travel (buildings beside these stay low so the cars stay visible) ---- */

    if(carB.visible){carB.position.set(52+4*q,.1,-150+145.25*p-3*q);carB.rotation.set(.06*q,-Math.PI/2-.5*q,0);carB.scale.setScalar(1.25*s)}
    /* a few fragments thrown out at impact */
    var td=c-CT;
    deb.forEach(function(d){var on=td>0&&td<1.2&&fo>.05;d.m.visible=on;if(on){d.m.position.set(48+d.vx*td,Math.max(.4,4+d.vy*td-45*td*td),1+d.vz*td);d.m.scale.setScalar(Math.max(.01,1-td/1.2));d.m.rotation.set(td*6,td*4,0)}});
    var pr=prog(c,CT,CT+1.5);pulse.scale.setScalar(.5+pr*2.4);pulse.material.opacity=pr>0&&pr<1?.7*(1-pr)*fo:0;
    /* marker, zone and route appear after the crash */
    var a0=ease(prog(c,CT+.5,CT+1.1))*fo,bk=reduce?1:.3+.7*(.5+.5*Math.sin((c-CT-1.4)*7)),bl=1-(1-bk)*ease(prog(c,CT+1.3,CT+1.7));
    setPin(pins[0],a0,a0*bl);
    var zz=ease(prog(c,CT+.8,CT+1.6))*fo;zone.material.opacity=.1*zz;zl.material.opacity=.55*zz;
    var rr=ease(prog(c,4.6,7.6))*(1-ease(prog(c,25,26.6)));drawTo(route,rr);drawTo(halo,rr);
    var ra=ease(prog(c,6.2,9.2))*(1-ease(prog(c,25,26.6)));drawTo(routeM,ra);drawTo(haloM,ra);
    /* response vehicle */
    s=ease(prog(c,5,5.7))*fo;carR.visible=s>.02;
    at(trR,sStop*sm(prog(c,5.2,19.2)));
    if(carR.visible){carR.position.set(pose.x,.1,pose.z);carR.rotation.set(0,pose.h,0);carR.scale.setScalar(1.3*s)}
    siren(carR,s>.02?1:0);
    glow.position.set(pose.x,.3,pose.z);glow.material.opacity=.16*s;
    carLight.position.set(pose.x,12,pose.z);W.localToWorld(carLight.position);carLight.intensity=1.2*s;
    /* ambulance arrives from the east a little later */
    s=ease(prog(c,6.8,7.5))*fo;carM.visible=s>.02;
    at(trM,trM.L*sm(prog(c,7,18)));
    if(carM.visible){carM.position.set(pose.x,.1,pose.z);carM.rotation.set(0,pose.h,0);carM.scale.setScalar(1.25*s)}
    siren(carM,s>.02?1:0);
    /* label follows the marker */
    var w=vis.clientWidth,h=vis.clientHeight;
    lv.set(52,pins[0].H+40,0);W.localToWorld(lv);lv.project(cam);
    pl.style.transform='translate('+Math.round((lv.x*.5+.5)*w+26)+'px,'+Math.round((-lv.y*.5+.5)*h-8)+'px)';
    pl.style.opacity=ease(prog(c,CT+1,CT+1.5))*fo;
  }
  function draw(){intro(introT);placeCars(clk);event(cyc());R.render(sc,cam)}
  function size(){
    var w=vis.clientWidth,h=vis.clientHeight;if(!w||!h)return;
    lite=narrow.matches;R.setPixelRatio(Math.min(devicePixelRatio||1,lite?1.5:1.75));
    R.setSize(w,h,false);cam.aspect=w/h;mult=Math.max(1,1/(w/h));cam.updateProjectionMatrix();draw();
  }
  /* light/dark palette for the scene; tonL maps the dark building tones to a warm light scale */
  function tonL(h){var l=(((h>>16)&255)+((h>>8)&255)+(h&255))/765,v=Math.max(.5,.97-1.3*l);return new T.Color(v,v*.985,v*.94)}
  function applyTheme(L,redraw){
    isLt=L;
    fog.color.setHex(L?0xEEEBE3:0x121212);gm.color.setHex(L?0xE9E5DB:0x171715);
    gcol.setHex(L?0xE9E5DB:0x171715);rcol.setHex(L?0xC2BDAE:0x211f1c);scol.setHex(L?0xF7F4EC:0x34342f);
    amb.color.setHex(L?0xffffff:0x9a968a);amb.intensity=L?.62:.62;
    d1.color.setHex(L?0xFFF3D6:0xE9DDAA);d1.intensity=L?.5:.95;d2.intensity=L?.15:.3;
    dashes.material.color.setHex(L?0x7A5A1A:0xC9A45C);pulse.material.color.setHex(L?0x8A6420:0xE9DDAA);
    items.forEach(function(it,n){if(L)col.copy(tonL(it.c));else col.setHex(it.c);inst.setColorAt(n,col)});
    inst.instanceColor.needsUpdate=true;
    pins[0].sp.material.map=tex('res');pins[0].sp.material.needsUpdate=true;
    if(redraw)draw();
  }
  window.agapScene=applyTheme;
  if(isLt)applyTheme(true,false);
  size();
  var ro=window.ResizeObserver?new ResizeObserver(size):null;if(ro)ro.observe(vis);else addEventListener('resize',size);

  /* ---- loop: one rAF, paused when off screen, torn down on page hide ---- */
  var raf=0,t0=null,prev=0,settled=false,io=null;
  function loop(ts){
    raf=requestAnimationFrame(loop);
    if(t0===null){t0=ts;prev=ts}
    var t=(ts-t0)/1000,dt=Math.min(.05,(ts-prev)/1000);prev=ts;clk=t;
    D+=ease(prog(t,2.4,4.4))*dt;
    if(t<5)intro(t);else if(!settled){intro(99);settled=true}
    placeCars(t);event(cyc());R.render(sc,cam);
  }
  function stop(){if(raf){cancelAnimationFrame(raf);raf=0}}
  function start(){if(!raf&&!reduce){prev=performance.now();raf=requestAnimationFrame(loop)}}
  function destroy(){
    stop();if(io)io.disconnect();if(ro)ro.disconnect();else removeEventListener('resize',size);
    disp.forEach(function(d){d.dispose&&d.dispose()});inst.dispose();roads.dispose();walks.dispose();dashes.dispose();R.dispose();
  }
  cv.addEventListener('webglcontextlost',function(e){e.preventDefault();stop();fallback()});
  addEventListener('pagehide',destroy);
  if(reduce){introT=99;draw();return}
  introT=0;draw();start();
  if(window.IntersectionObserver){io=new IntersectionObserver(function(en){en[0].isIntersecting?start():stop()});io.observe(vis)}
})();
</script>
